<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>联系我们 - 绿途</title>
    <link rel="stylesheet" href="css/s.css">
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">
                <img src="images/1012.gif" alt="绿途可持续旅行">
            </div>
            <ul class="nav-links">
                <li><a href="3.html">首页</a></li>
                <li><a href="4.html">生态目的地</a></li>
                <li><a href="5.html">旅行故事</a></li>
                <li class="active"><a href="6.html">联系</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>开启环保合作</h1>
                <p>您的建议将助力可持续旅行发展</p>
            </div>
        </section>

        <section class="contact-container">
            <div class="contact-info">
                <h2>📬 联系方式</h2>
                <div class="info-card">
                    <div class="info-item">
                        <img src="images/888.gif" alt="邮箱">
                        <p>eco@greentour.com</p>
                    </div>
                    <div class="info-item">
                        <img src="images/1111.gif" alt="电话">
                        <p>400-800-1234</p>
                    </div>
                    <div class="info-item">
                        <img src="images/6666.gif" alt="地址">
                        <p>上海市徐汇区可持续大厦18层</p>
                    </div>
                </div>
            </div>

            <form class="contact-form">
                <h2>📝 合作咨询</h2>
                <div class="form-group">
                    <label>姓名：</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>邮箱：</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>咨询类型：</label>
                    <select>
                        <option>生态认证咨询</option>
                        <option>社区合作</option>
                        <option>媒体合作</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>留言：</label>
                    <textarea rows="5" placeholder="请描述您的合作需求..."></textarea>
                </div>
                <button type="submit" class="cta-button">提交申请</button>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© 2025 绿途可持续旅行 | 遵循《巴黎协定》环保标准</p>
            <div class="social-links">
                <a href="https://weixin.qq.com/"><img src="images/wechat1.png" alt="微信"></a>
                <a href="https://weibo.com/"><img src="images/weibo1.gif" alt="微博"></a>
            </div>
        </div>
    </footer>
</body>
</html>
